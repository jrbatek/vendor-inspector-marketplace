name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: https://vendor-inspector-marketplace.vercel.app
    steps:
      - name: Wait for deployment and verify live routes
        run: |
          set -euo pipefail

          routes=(
            "/"
            "/project-coordinator"
            "/inspectors"
            "/demo/client"
            "/demo/client-analytics"
            "/demo/client-history"
            "/demo/client-operations"
            "/demo/client-data"
            "/demo/inspector"
            "/email-requirements?demo=1"
          )

          expected=(
            "InspectSource"
            "InspectSource"
            "InspectSource"
            "Client Demo"
            "Analytics"
            "Inspection History"
            "Commercial and account management"
            "InspectSource API"
            "Inspector Demo"
            "Email Requirements"
          )

          for attempt in $(seq 1 12); do
            echo "Production smoke attempt $attempt of 12"
            all_ok=true

            for i in "${!routes[@]}"; do
              route="${routes[$i]}"
              marker="${expected[$i]}"
              body="$(mktemp)"
              status="$(curl -L -sS -o "$body" -w '%{http_code}' "$PRODUCTION_URL$route" || true)"

              if [ "$status" -lt 200 ] || [ "$status" -ge 400 ] || ! grep -Fqi "$marker" "$body"; then
                echo "Not ready: $route returned HTTP $status or marker '$marker' was absent."
                all_ok=false
              elif [[ "$route" == /demo/* ]] && ! grep -Fqi 'Demo Mode' "$body"; then
                echo "Not ready: $route returned HTTP $status but the Demo Mode boundary was absent."
                all_ok=false
              else
                echo "OK: $route ($status, marker: $marker)"
              fi

              rm -f "$body"
            done

            if [ "$all_ok" = true ]; then
              echo "Production deployment passed live and synthetic-demo smoke testing."
              exit 0
            fi

            sleep 15
          done

          echo "Production did not pass smoke testing within the deployment window."
          exit 1
