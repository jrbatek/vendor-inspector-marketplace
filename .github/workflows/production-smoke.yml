name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional exact merged main SHA to verify before production route smoke"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRODUCTION_URL: https://vendor-inspector-marketplace.vercel.app
      EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
    steps:
      - name: Wait for deployment and verify live routes
        run: |
          set -euo pipefail
          if [ -n "$EXPECTED_SHA" ]; then
            if [[ ! "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
              echo "Production smoke dispatched on wrong commit: expected $EXPECTED_SHA, running $GITHUB_SHA."
              exit 1
            fi
            echo "Production smoke pinned to merged main $EXPECTED_SHA."
          fi

          routes=(
            "/"
            "/project-coordinator"
            "/inspectors"
            "/demo/client"
            "/demo/client-inspections"
            "/demo/client-agency-sourcing"
            "/demo/client-analytics"
            "/demo/client-history"
            "/demo/client-operations"
            "/demo/client-data"
            "/demo/agency"
            "/demo/agency-affiliations"
            "/demo/agency-commercials"
            "/demo/inspector"
            "/demo/inspector-selection-outcomes"
            "/demo/inspector-documents"
            "/demo/inspector-income"
            "/demo/inspector-work-history"
            "/email-requirements?demo=1"
          )

          expected=(
            "InspectSource"
            "InspectSource"
            "InspectSource"
            "Client Demo"
            "Inspections in Progress"
            "Choose how to source inspectors"
            "Analytics"
            "Inspection History"
            "Commercial and account management"
            "InspectSource API"
            "Agency Workspace"
            "Agency Resource Affiliations"
            "Client contracts"
            "Inspector Demo"
            "Selection Insights"
            "Qualification Documents"
            "Assignment earnings"
            "Work History"
            "Email Requirements"
          )

          for attempt in $(seq 1 12); do
            echo "Production smoke attempt $attempt of 12"
            all_ok=true

            for i in "${!routes[@]}"; do
              route="${routes[$i]}"
              marker="${expected[$i]}"
              body="$(mktemp)"
              status="$(curl -L -sS -o "$body" -w '%{http_code}' "$PRODUCTION_URL$route" || true)"

              if [ "$status" -lt 200 ] || [ "$status" -ge 400 ] || ! grep -Fqi "$marker" "$body"; then
                echo "Not ready: $route returned HTTP $status or marker '$marker' was absent."
                all_ok=false
              elif [[ "$route" == /demo/* ]] && ! grep -Fqi 'Demo Mode' "$body"; then
                echo "Not ready: $route returned HTTP $status but the Demo Mode boundary was absent."
                all_ok=false
              else
                echo "OK: $route ($status, marker: $marker)"
              fi

              rm -f "$body"
            done

            if [ "$all_ok" = true ]; then
              echo "Production deployment passed live and three-sided synthetic-demo smoke testing."
              exit 0
            fi

            sleep 15
          done

          echo "Production did not pass smoke testing within the deployment window."
          exit 1
