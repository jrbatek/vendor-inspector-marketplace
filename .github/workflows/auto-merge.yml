name: Auto-merge validated autonomous releases

on:
  workflow_run:
    workflows: ["Validate application", "Autonomous QA"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated autonomous branches only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this validation run; nothing to merge."
            exit 0
          fi

          HEAD_REF="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref')"
          DRAFT="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')"

          case "$HEAD_REF" in
            autonomous-*) ;;
            *)
              echo "PR #$PR_NUMBER uses branch '$HEAD_REF', not an autonomous-* branch. Leaving it for manual review."
              exit 0
              ;;
          esac

          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is still a draft; not merging."
            exit 0
          fi

          # An autonomous-* name alone never authorizes a merge. Label only
          # clearly synthetic, low-risk PRs after reviewing their diff.
          PR_JSON="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"
          BASE_SHA="$(jq -r '.base.sha' <<< "$PR_JSON")"
          RUN_SHA="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')"
          SAFE_LABEL="$(jq -r '[.labels[].name] | index("safe-demo-auto-merge") != null' <<< "$PR_JSON")"

          if [ "$SAFE_LABEL" != true ]; then
            echo "No safe-demo-auto-merge label on PR #$PR_NUMBER; leaving it for the managed release loop."
            exit 0
          fi

          if [ "$HEAD_SHA" != "$RUN_SHA" ]; then
            echo "The validated head $RUN_SHA differs from current PR head $HEAD_SHA; skip stale workflow."
            exit 0
          fi

          CURRENT_MAIN="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          if [ "$BASE_SHA" != "$CURRENT_MAIN" ]; then
            echo "main moved since PR validation; require rebase and fresh checks."
            exit 0
          fi

          # Defense-in-depth: even a labeled PR cannot auto-merge sensitive changes.
          FILES="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          if grep -Eiq '(^[.]github/|^supabase/|^database/|^integrations/|^app/api/|(^|/)(auth|login|session|credentials|payment|billing|bank|tax|matching|pricing|rls|privacy|legal|signature)(/|[.]|[-]|_))' <<< "$FILES"; then
            echo "Sensitive file or release workflow changed: stop at reviewable PR."
            exit 0
          fi

          CHECK_RUNS="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100")"
          VALIDATE_OK="$(jq -r '[.check_runs[] | select(.name == "validate" and .conclusion == "success")] | length' <<< "$CHECK_RUNS")"
          QA_OK="$(jq -r '[.check_runs[] | select(.name == "synthetic-and-app-validation" and .conclusion == "success")] | length' <<< "$CHECK_RUNS")"
          if [ "$VALIDATE_OK" -lt 1 ] || [ "$QA_OK" -lt 1 ]; then
            echo "Both exact-head application validation and autonomous QA must pass before merging."
            exit 0
          fi

          VERCEL_OK="$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "Vercel" and .state == "success" and (.target_url | startswith("https://vercel.com/")))] | length')"
          if [ "$VERCEL_OK" -lt 1 ]; then
            echo "Exact-head Vercel preview is not READY; do not merge."
            exit 0
          fi

          echo "Both CI workflows and Vercel preview passed at $HEAD_SHA, current main $CURRENT_MAIN."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"
