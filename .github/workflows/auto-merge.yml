name: Auto-merge validated autonomous releases

on:
  workflow_run:
    workflows: ["Validate application"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge validated autonomous branches only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this validation run; nothing to merge."
            exit 0
          fi

          HEAD_REF="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref')"
          DRAFT="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')"

          case "$HEAD_REF" in
            autonomous-*) ;;
            *)
              echo "PR #$PR_NUMBER uses branch '$HEAD_REF', not an autonomous-* branch. Leaving it for manual review."
              exit 0
              ;;
          esac

          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is still a draft; not merging."
            exit 0
          fi

          echo "Validation succeeded for autonomous branch '$HEAD_REF'. Merging PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
