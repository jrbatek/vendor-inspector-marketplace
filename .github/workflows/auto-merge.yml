name: Auto-merge validated autonomous releases

on:
  workflow_run:
    workflows: ["Validate application"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only explicitly autonomous PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[0].number // empty')"
          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request is associated with this validation run; nothing to merge."
            exit 0
          fi

          LABEL_COUNT="$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" --jq '[.[] | select(.name == "autonomous-release")] | length')"
          if [ "$LABEL_COUNT" != "1" ]; then
            echo "PR #$PR_NUMBER is not labeled autonomous-release; leaving it for manual review."
            exit 0
          fi

          DRAFT="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.draft')"
          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is still a draft; not merging."
            exit 0
          fi

          echo "Validation succeeded and autonomous-release label is present. Merging PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch
