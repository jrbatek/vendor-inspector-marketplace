name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Browsers and native dependencies are preinstalled in the official, version-pinned image.
    # Avoid host 'apt' downloads, which stalled on runner Ubuntu archive DNS on 2026-11-11.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Scan database migrations for unsafe operations
        run: npm run check:migrations

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Verify pinned Chromium and Firefox are installed in CI image
        run: |
          node -e "const fs=require('fs'); const p=require('playwright'); for (const name of ['chromium','firefox']) { const path=p[name].executablePath(); if(!fs.existsSync(path)) throw Error(name+' browser missing: '+path); }"

      - name: Smoke-test built routes
        run: npm run smoke:local

      - name: Exercise client analytics in real Chromium
        run: npm run smoke:client-analytics

      - name: Exercise Client Analytics in headed Chromium (Xvfb)
        run: ANALYTICS_HEADED=1 xvfb-run -a npm run smoke:client-analytics

      - name: Exercise Client Analytics source transitions in Firefox
        run: ANALYTICS_BROWSER=firefox npm run smoke:client-analytics

      - name: Exercise active Client Demo in real Chromium
        run: npm run smoke:client-inspections

      - name: Exercise Source of Inspectors selection and contrast in Chromium
        run: npm run smoke:client-sourcing

      - name: Exercise synthetic Agency Commercials region filters in Chromium
        run: npm run smoke:agency-commercials

      - name: Exercise synthetic Agency capacity region filters in Chromium
        run: npm run smoke:agency-capacity
      - name: Exercise Agency one-page scrollspy and removed sections in Chromium
        run: npm run smoke:agency-scrollspy

      - name: Exercise InspectorHub demo routing, calendar, availability and notice isolation
        run: npm run smoke:inspector-demo

      - name: Verify filtered Work History counters and sample report in Chromium
        run: npm run smoke:work-history

      - name: Audit visible demo controls on desktop and mobile
        run: npm run smoke:demo-controls

      - name: Verify fictional income report PDF download in Chromium
        run: npm run smoke:inspector-income

      - name: Diagnose current public production filters (non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: ANALYTICS_BASE_URL=https://vendor-inspector-marketplace.vercel.app npm run smoke:client-analytics
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Preserve Client Analytics failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-analytics-browser-failure-validate
          path: artifacts/client-analytics-browser-failure.png
          if-no-files-found: ignore
          retention-days: 14
