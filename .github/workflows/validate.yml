name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Scan database migrations for unsafe operations
        run: npm run check:migrations

      - name: Type-check application
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Install Chromium for client interaction regression
        run: npx playwright install --with-deps chromium

      - name: Smoke-test built routes
        run: npm run smoke:local

      - name: Exercise client analytics in real Chromium
        run: npm run smoke:client-analytics

      - name: Diagnose current public production filters (non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: ANALYTICS_BASE_URL=https://vendor-inspector-marketplace.vercel.app npm run smoke:client-analytics
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
